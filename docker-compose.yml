services:
  boiler-reader:
    image: ghcr.io/tc-fpv/boiler-reader:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      WEB_PORT: ${WEB_PORT:-8080}
      RTSP_URL: ${RTSP_URL:-}
      RTSP_USER: ${RTSP_USER:-}
      RTSP_PASS: ${RTSP_PASS:-}
      HA_WEBHOOK_URL: ${HA_WEBHOOK_URL:-}
      HA_WEBHOOK_TIMEOUT: ${HA_WEBHOOK_TIMEOUT:-5}
      EASYOCR_MODULE_PATH: /data/.EasyOCR
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    volumes:
      - boiler_reader_data:/data

volumes:
  boiler_reader_data:
