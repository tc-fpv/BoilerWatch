services:
  boilerwatch:
    image: ghcr.io/tc-fpv/boilerwatch:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      WEB_PORT: ${WEB_PORT:-8080}
      EASYOCR_MODULE_PATH: /data/.EasyOCR
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    volumes:
      - boilerwatch_data:/data

volumes:
  boilerwatch_data:
