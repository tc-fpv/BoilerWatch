services:
  boilerwatch:
    image: ghcr.io/tc-fpv/boilerwatch:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      WEB_PORT: ${WEB_PORT:-8080}
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    volumes:
      - boilerwatch_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Removes dangling (superseded) images left behind by each pull
  image-pruner:
    image: docker:cli
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          docker image prune -f
          sleep 3600
        done

volumes:
  boilerwatch_data:
