services:
  boiler-reader:
    image: ghcr.io/tc-fpv/boiler-reader:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      WEB_PORT: ${WEB_PORT:-8080}
      EASYOCR_MODULE_PATH: /data/.EasyOCR
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    volumes:
      - boiler_reader_data:/data

volumes:
  boiler_reader_data:
